<script>

const c="signalwatch-v4.everstreet.testnet";

let content;
if(DATA.id==="first-shift"){
const check=(t,v)=>["<span class='mark'>✓</span> "+t,v];
content='<section class="hero"><div class="between"><div><div class="eyebrow">Signalwatch · owner</div><h2>Noah Brandt</h2></div>'+badge("Generation 4")+'</div><div class="toolbar"><a href="../proof-a/index.html">View handoff proof</a></div></section>'+grid(box("Business controls",list([check("You control Signalwatch","NEAR · generation 4"),check("New customer uses","Metering active"),check("Prepaid units","80 at close"),check("Your team","Metering operator kept")])),stack(box("External feed",list([["Publisher role","Generation 3 → 4"],["Destination","Noah’s generation 4 address"],["Finality",pending("Pending · EVM test network")]])+detail("Move feed role to your address",list([["Transaction","Awaiting final receipt"],["Seller-era signatures","Check after publisher change"]]))),box("Supplier allowance",list([["Larchmere Models","Ended at close"]])+'<a href="../allowance/index.html">Review and re-grant allowance →</a>')));
}
if(DATA.id==="allowance"){
content=grid(stack(box("Larchmere Models",'<div class="pills">'+badge("Ended at sale","warm")+'</div>'+list([["Funding","Separate operating budget"],["Rate","0.90 TUSD per analysis"],["Per payment","2.00 TUSD hard cap"],["Per week","60.00 TUSD"],["Owner review","Above 5.00 TUSD · exact invoice"],["Sale","Ends unless buyer re-grants"]])+detail("Review threshold",list([["Above 2.00 TUSD","Agent payment refused"],["Above 5.00 TUSD","Owner review · separate payment path"]]))),box("Invoice LM-024",list([["Supplier","Larchmere Models"],["Invoice","6.30 TUSD · 7 analyses"],["Status",pending("Awaiting exact invoice approval")],["Grant","Generation 3 · expired"],["Payment",attackBadge("Agent cap exceeded")]])+detail("Review invoice",list([["Invoice digest","fixture:invoice-024"],["Owner decision","Generation 4 approval required"]])))),box("This week",'<div class="big">42.00 <span class="unit">/ 60.00 TUSD</span></div><div class="bar" role="img" aria-label="42 of 60 TUSD spent"><span></span><span></span></div>'+list([["Remaining","18.00 TUSD"],["Customer money","Excluded"],["Current grant","Ended · generation 3"]])+detail("Review new grant",list([["Owner","Noah Brandt"],["Policy","Generation 4 · Larchmere Models only"],["Status","Static mock-up"]]))));
}
if(DATA.id==="use-economics"){

const financial=stack(box("Per-use economics",list([["Earned revenue","4.00 TUSD"],["Supplier cost","0.90 TUSD"],["Contribution margin","3.10 TUSD"]])),box("Books · TUSD",list([["Earned revenue","84.00 TUSD"],["Customer funds owed","316.00 TUSD"],["Supplier cost","18.90 TUSD"],["Founder-entered costs","Unknown"]])+detail("Books · USD",list([["Founder-entered costs","USD 12.00 · fictional"],["Compute","Unknown"]]))),box("Buyer scenario · TUSD",'<label for="assumption">Monthly analyses</label><input id="assumption" type="number" min="0" max="1000000" value="100"><div class="space">'+list([["Projected monthly contribution",'<output id="projection" for="assumption">310.00 TUSD</output>'],["Scenario scope","Buyer’s assumptions"],["Seller books","Read-only"]])+'</div>'));
content='<div class="toolbar tabs">'+btn("Customer view",'data-view="customer" aria-pressed="true"')+btn("Owner and buyer view",'data-view="books" aria-pressed="false"')+'</div><div id="customer-view">'+grid(customer,box("Your access",metrics([["Prepaid","100"],["Used","21"],["Available","79"]])))+'</div><div id="books-view" hidden>'+grid(customer,financial)+'</div>';
}
if(DATA.id==="agent-purchases"){
content=grid(stack(box("Purchase AP-019",list([["Agent","Supply Desk"],["Offer","Signalwatch · one analysis"],["HTTP response","402 · exact offer"],["Price","4.00 TUSD"],["Relayed action","Purchase · 1 unit"],["Contract receipt","Confirmed · 1 unit granted"],["Next purchase",pending("Relayed · 0 units granted")]])+detail("Offer and purchase binding",list([["Token","TUSD"],["Recipient",c],["Purpose","purchase-019 · fixture"],["Replay","Same purchase ID"]]))),box("Purchase totals",metrics([["Units bought","12"],["Confirmed","12"],["Pending","1"]]))),box("Relay budget",'<div class="big">0.014 <span class="unit">/ 0.020 test NEAR</span></div><div class="bar" role="img" aria-label="0.014 of 0.020 test NEAR used"><span></span><span></span></div>'+list([["Remaining","0.006 test NEAR"],["Budget scope","Relay gas"],["Units credited","Contract-confirmed purchases"]])));
}

document.querySelector("#content").innerHTML=content;
document.addEventListener("click",(e)=>{
 const b=e.target.closest("button"); if(!b)return;
 if(b.dataset.role) document.querySelector(".actor").textContent="Acting as "+b.dataset.role;
 if(b.dataset.rpc){for(const id of ["agree","uncertain"])document.getElementById(id).hidden=id!==b.dataset.rpc;for(const x of document.querySelectorAll("[data-rpc]"))x.setAttribute("aria-pressed",String(x===b));}

 if(b.hasAttribute("data-download")){const payload=DATA.recorded?DATA.record:{source:"synthetic_run",contract:c,owner:"Noah Brandt",generation:4,keys:0,termsDigest:"fixture:9a04-f783",closeTransaction:"fixture:close-04",codeHash:"fixture:wasm-04",unitsAtClose:80,unitsAfterNextUse:79};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=DATA.recorded?"testnet-evidence-excerpt.json":"synthetic-handoff-receipt.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),500);}
});
