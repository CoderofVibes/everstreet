ween{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between;gap:14px}.toolbar{margin-top:15px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}.equal{grid-template-columns:repeat(2,minmax(0,1fr))}.stack{display:grid;gap:14px;min-width:0}.card{padding:21px 23px;border:1px solid var(--line);border-radius:17px;background:#fff;min-width:0}.card h2{margin-bottom:12px}.card h3{margin-bottom:7px}.hero{background:linear-gradient(115deg,#fff 35%,#eef1ff);border:1px solid #c7d2f7;padding:26px;border-radius:20px;margin-bottom:16px}.hero .between{align-items:end}.number{font:650 clamp(44px,6vw,76px)/1 "Cascadia Mono",Consolas,monospace;letter-spacing:-.075em}.unit{font-size:16px;font-weight:650;letter-spacing:0}.big{font-size:32px;font-weight:700;letter-spacing:-.045em}.mono,code{font-family:"Cascadia Mono",Consolas,monospace;overflow-wrap:anywhere}.muted,dt{color:var(--mute)} .badge,.source{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:12px;line-height:1.3;font-weight:700;border-radius:6px;padding:4px 7px;vertical-align:middle}.badge{background:#e5f3eb;color:var(--green)}.outline{background:transparent;color:var(--amber);border:1px dashed #956426}.error{color:var(--red);background:#fdeceb}.source{background:#ebeffd;color:#283965;font-weight:600}.warm{background:var(--warm);color:var(--amber)}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:8px;padding:10px 0;border-top:1px solid var(--line)} .row dd{font-weight:600;min-width:0;overflow-wrap:anywhere} .row dd .source{display:table;margin-top:5px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:14px}.metric{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;min-width:0}.metric strong{display:block;font-size:27px;line-height:1.2}.steps{display:flex;flex-wrap:wrap;gap:7px;list-style:none;padding:0;margin:11px 0}.steps li{border:1px solid #b5c5e8;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:650}.steps li.outline{border-color:#956426}.space{margin-top:15px}.compact{font-size:13px}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.compare div{border:1px solid var(--line);border-radius:9px;padding:10px}.compare .negative{border-left:3px solid #a32620}.compare .positive{border-left:3px solid #185c3d}.callout{border:1px dashed #956426;color:var(--amber);padding:11px 13px;border-radius:8px}.panel-b{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}.rail{position:sticky;top:12px}.rail a{display:block;padding:7px 0}.rules{border-top:3px solid #3155d9;border-radius:0 0 13px 13px}.case{scroll-margin-top:12px}.case h3{font-size:18px}.detail summary{cursor:pointer;color:#2846c4;padding:8px 0;font-weight:650}.detail[open]{margin-bottom:4px}.thin{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}.bar{display:grid;grid-template-columns:7fr 3fr;height:12px;margin:12px 0;border:1px solid #8192b4;border-radius:6px;overflow:hidden}.bar span:first-child{background:repeating-linear-gradient(135deg,#3155d9,#3155d9 5px,#ebeffd 5px,#ebeffd 8px)}.split{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}.state-check{display:flex;gap:9px;align-items:center}.mark{color:#185c3d;font-weight:800}.tabs{margin-bottom:14px}.tabs button[aria-pressed=true]{background:var(--bl);color:#253daf;border-color:#7c8ed1}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)} [hidden]{display:none!important} .skip{position:absolute;left:15px;top:-70px;background:white;padding:8px}.skip:focus{top:10px}

<a class="skip" href="#main">Skip to content</a><header><div class="top"><div class="brand"><span class="logo" aria-hidden="true">E</span>Everstreet</div><nav aria-label="Workspace"><span>Discover</span><span>Build</span><span>Operate</span><span class="active" aria-current="page">Acquire</span></nav><div class="actor">Acting as Noah Brandt</div></div></header>
<main id="main"><div class="heading"><div class="eyebrow">Evidence Register · Signalwatch · Deal 04</div><h1>Handoff proof</h1><div class="toolbar"><span class="badge warm">Fictional · Simulated history</span></div></div><div id="content"></div></main>
<script>
const DATA={"id":"proof-b","variant":"b","recorded":false};
const badge=(s,k="")=>'<span class="badge '+k+'">'+s+'</span>';
const src=(s)=>'<span class="source">'+s+'</span>';
const row=(k,v,s)=>'<div class="row"><dt>'+k+'</dt><dd>'+v+(s?src(s):'')+'</dd></div>';
const list=(r)=>'<dl>'+r.map(x=>row(...x)).join('')+'</dl>';
const box=(t,b,c="")=>'<section class="card '+c+'"><h2>'+t+'</h2>'+b+'</section>';
const detail=(t,b)=>'<details class="detail"><summary>'+t+'</summary>'+b+'</details>';
const metric=(l,v)=>'<div class="metric"><strong>'+v+'</strong>'+l+'</div>';
const metrics=(r)=>'<div class="metrics">'+r.map(x=>metric(...x)).join('')+'</div>';
const stack=(...c)=>'<div class="stack">'+c.join('')+'</div>';
const grid=(a,b,c="")=>'<div class="grid '+c+'">'+a+b+'</div>';
const btn=(s,action,primary=false)=>'<button type="button" '+(primary?'class="primary" ':'')+action+'>'+s+'</button>';
const pending=(s)=>badge(s,"outline");
const attackBadge=(s)=>badge(s,"error");
const fixture="◇ Synthetic run", app="▤ Everstreet record", node="⬡ Local NEAR node", final="◎ Testnet final read", tx="▣ Testnet receipt", light="⌁ Light-client proof";
const c="signalwatch-v4.everstreet.testnet";
const signers="Delphine Marsh → Noah Brandt";

const recorded=DATA.recorded;
const r=DATA.record;
const contract=recorded?r.account:c;
const owner=recorded?r.owner:"Noah Brandt";
const generation=recorded?"2":"4";
const basis=recorded?final:fixture;
const receipt=recorded?tx:fixture;
const transaction=recorded?'<a href="'+r.link+'"><code>'+r.hash+'</code></a>':'<code>close-04 · fixture</code>';
const facts=box("Close evidence",list([["Business contract","<code>"+contract+"</code>",basis],["Owner",owner,basis],["Generation",generation,basis],["Access keys","0",basis],["Code hash","<code>"+(recorded?r.code:"wasm-04 · fixture")+"</code>",basis],["Terms digest","<code>"+(recorded?r.digest:"9a04…f783 · fixture")+"</code>",receipt],["Close transaction",transaction,receipt],["Units at close","80",basis],["Next settled use","1 · 79 remaining",basis],["Result delivery",recorded?"Recorded":"Stand-in model",app]]));
const continuity='<section class="hero"><div class="between"><div><div class="eyebrow">'+(recorded?"Customer entitlement":"Cara Okafor · customer")+'</div><div class="number">80 → 79</div></div>'+badge("Next use settled")+'</div>'+'<div class="pills space"><span class="source">80 at close</span><span class="source">1 analysis charged</span></div>'+'<div class="toolbar">'+src(basis)+(recorded?'<a class="btn" href="'+r.link+'">View close in explorer ↗</a>':'<a class="btn" href="../use-economics/index.html">View Cara’s use</a>')+'</div></section>';
const access=recorded?box("Recorded transfer",list([["Ended","Former owner control",final],["Carried over","80 prepaid units",final],["Current owner",owner,final],["External feed","Outside this recording",app]])):box("Rights after the sale",list([["Ended","Delphine’s owner role · supplier allowance",fixture],["Carried over","Metering grant · Cara’s 80 redeemable units",fixture],["Noah operates","Releases, team and treasury",fixture],["Delphine’s claim","180 TUSD sale proceeds",fixture],["Still possible","Cara’s signed open hold until 2:45 PM PT",fixture],["External publisher",pending("Pending · EVM finality"),fixture]]));
const sourceKey=box("Evidence sources",detail("Source key",[fixture,node,final,tx,light+" · proved against block header",app].map(src).join(' '))+list([["Consensus proof",recorded?"Unavailable":"Fixture · proof not attached"],["Attack suite",'<a href="../attacks-b/index.html">View test layouts</a>']]));
const rpc=recorded?box("Recorded block",list([["Block height",r.height,final],["Block hash","<code>"+r.block+"</code>",final],["Two-provider check","Unavailable",app]])):box("RPC comparison",'<div class="toolbar tabs">'+btn("Agreement",'data-rpc="agree" aria-pressed="true"')+btn("Disagreement",'data-rpc="uncertain" aria-pressed="false"')+'</div><div id="agree">'+list([["Block","Fixture block 4204",fixture],["Provider A","Noah Brandt · generation 4",fixture],["Provider B","Noah Brandt · generation 4",fixture],["Observation",badge("Agree at the same block"),fixture]])+'</div><div id="uncertain" hidden>'+list([["Block","Fixture block 4204",fixture],["Provider A","Noah Brandt · generation 4",fixture],["Provider B","Delphine Marsh · generation 3",fixture],["Observation",pending("Uncertain · providers disagree"),fixture],["Last coherent close","Separate from this comparison",fixture]])+'</div>');
const download='<div class="toolbar">'+btn(recorded?"Download evidence excerpt":"Download handoff receipt","data-download",true)+'</div>';
const content=DATA.variant==="b"?'<div class="panel-b"><aside class="card rail"><h2>Evidence</h2>'+list([["Control","Generation 4"],["Customer units","80 at close"]])+download+'<a href="#customer">Customer use ↓</a></aside>'+stack(facts,grid(rpc,sourceKey,"equal"),access,'<div id="customer">'+continuity+'</div>')+'</div>':continuity+grid(stack(facts,access),stack(box("Handoff receipt",download),rpc,sourceKey));


if(location.hash.includes('capture-phone'))document.documentElement.classList.add('capture-phone');
document.querySelector("#content").innerHTML=content;
document.addEventListener("click",(e)=>{
 const b=e.target.closest("button"); if(!b)return;
 if(b.dataset.role) document.querySelector(".actor").textContent="Acting as "+b.dataset.role;
 if(b.dataset.rpc){for(const id of ["agree","uncertain"])document.getElementById(id).hidden=id!==b.dataset.rpc;for(const x of document.querySelectorAll("[data-rpc]"))x.setAttribute("aria-pressed",String(x===b));}
 if(b.dataset.view){for(const id of ["customer","books"])document.getElementById(id+"-view").hidden=id!==b.dataset.view;for(const x of document.querySelectorAll("[data-view]"))x.setAttribute("aria-pressed",String(x===b));document.querySelector(".actor").textContent="Acting as "+(b.dataset.view==="customer"?"Cara Okafor":"Noah Brandt");}
 if(b.hasAttribute("data-download")){const payload=DATA.recorded?DATA.record:{source:"synthetic_run",contract:c,owner:"Noah Brandt",generation:4,keys:0,termsDigest:"fixture:9a04-f783",closeTransaction:"fixture:close-04",codeHash:"fixture:wasm-04",unitsAtClose:80,unitsAfterNextUse:79};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=DATA.recorded?"testnet-evidence-excerpt.json":"synthetic-handoff-receipt.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),500);}
});
document.addEventListener("input",e=>{if(e.target.id==="assumption"){const v=e.target.valueAsNumber;document.querySelector("#projection").value=Number.isInteger(v)&&v>=0&&v<=1000000?(v*3.1).toFixed(2)+" TUSD":"Unknown";}});
if(location.hash.includes("books")) document.querySelector('[data-view="books"]')?.click();
</script></body></html>
