<main id="main"><div class="heading"><div class="eyebrow">Paired Trials · Signalwatch · Public results</div><h1>What we tried to break</h1><div class="toolbar"><span class="badge warm">Fictional · Simulated history</span></div></div><div id="content"></div></main>
<script>
const DATA={"id":"attacks-a","variant":"a","recorded":false,"attacks":[["Changed terms and stale seller","Exact terms accepted","Old digest · former seller appoints operator","Terms mismatch · E_NOT_OWNER"],["Dropped response or misleading success","Charge receipt reconciled","Response lost · outer success, child failed","Duplicate blocked · failed child receipt"],["Old write admitted before close","Current owner publishes release","Seller write resumes after freeze","Commit fence refused"],["Signed before the change","Generation 4 publisher posts","Generation 3 payload submitted after EVM finality","Publisher role refused"],["Poisoned observation","Same-block RPC agreement","Provider reports a conflicting owner","Uncertain · ownership update withheld"],["Quote or signer substitution","Exact quote and delegate accepted","Refund address or signer changed","Payload binding refused"],["Shared-cap race and storage pressure","First 0.90 TUSD spend reserved","Concurrent overspend · saturated queue","Budget refused · recovery slot preserved"],["Evidence substitution","Deal 04 checklist accepted","Checklist replayed from another deal","Deal and generation binding refused"],["Faults planted in our checks","Original checks pass","Generation guard removed · duplicate allowed","Owner epoch assertion · one-charge assertion"]]};
const badge=(s,k="")=>'<span class="badge '+k+'">'+s+'</span>';
const src=(s)=>'<span class="source">'+s+'</span>';
const row=(k,v,s)=>'<div class="row"><dt>'+k+'</dt><dd>'+v+(s?src(s):'')+'</dd></div>';
const list=(r)=>'<dl>'+r.map(x=>row(...x)).join('')+'</dl>';
const box=(t,b,c="")=>'<section class="card '+c+'"><h2>'+t+'</h2>'+b+'</section>';
const detail=(t,b)=>'<details class="detail"><summary>'+t+'</summary>'+b+'</details>';
const metric=(l,v)=>'<div class="metric"><strong>'+v+'</strong>'+l+'</div>';
const metrics=(r)=>'<div class="metrics">'+r.map(x=>metric(...x)).join('')+'</div>';
const stack=(...c)=>'<div class="stack">'+c.join('')+'</div>';
const grid=(a,b,c="")=>'<div class="grid '+c+'">'+a+b+'</div>';
const btn=(s,action,primary=false)=>'<button type="button" '+(primary?'class="primary" ':'')+action+'>'+s+'</button>';
const pending=(s)=>badge(s,"outline");
const attackBadge=(s)=>badge(s,"error");
const fixture="◇ Synthetic run", app="▤ Everstreet record", node="⬡ Local NEAR node", final="◎ Testnet final read", tx="▣ Testnet receipt", light="⌁ Light-client proof";
const c="signalwatch-v4.everstreet.testnet";
const signers="Delphine Marsh → Noah Brandt";

const a=DATA.attacks;
const snapshot=list([["Owner","Noah Brandt → Noah Brandt"],["Generation","4 → 4"],["Escrow","0 TUSD → 0 TUSD"],["Customer units","80 → 80"],["Pending payouts","1 → 1"]]);
const caseBody=(r)=>'<div class="compare"><div class="positive"><h3>✓ Clean run</h3>'+r[1]+'</div><div class="negative"><h3>✕ Attack run</h3>'+r[2]+'</div></div><div class="pills">'+attackBadge(r[3])+src("◇ Synthetic fixture")+'</div>'+detail("Protected values · unchanged",snapshot);
const cases=a.map((r,i)=>'<section class="card case '+(DATA.variant==="b"?"rules":"")+'" id="case-'+(i+1)+'"><div class="eyebrow">Group '+String(i+1).padStart(2,"0")+'</div><h3>'+r[0]+'</h3>'+(i===0?caseBody(r).replace("<details ","<details open "):caseBody(r))+'</section>');
const index='<aside class="card rail"><h2>Test groups</h2>'+a.map((r,i)=>'<a href="#case-'+(i+1)+'">'+(i+1)+' · '+r[0]+'</a>').join("")+'</aside>';
const content=DATA.variant==="a"?'<section class="hero"><div class="between"><div><div class="eyebrow">Protected state</div><h2>Owner · Escrow · Customer units</h2></div>'+badge("9 fixture cases","warm")+'</div>'+detail("Protected values · sample checkpoint",snapshot)+'</section><div class="grid equal">'+cases.join("")+'</div>':'<div class="panel-b">'+index+stack(...cases)+'</div>';


if(location.hash.includes('capture-phone'))document.documentElement.classList.add('capture-phone');
document.querySelector("#content").innerHTML=content;
document.addEventListener("click",(e)=>{
 const b=e.target.closest("button"); if(!b)return;
 if(b.dataset.role) document.querySelector(".actor").textContent="Acting as "+b.dataset.role;
 if(b.dataset.rpc){for(const id of ["agree","uncertain"])document.getElementById(id).hidden=id!==b.dataset.rpc;for(const x of document.querySelectorAll("[data-rpc]"))x.setAttribute("aria-pressed",String(x===b));}
 if(b.dataset.view){for(const id of ["customer","books"])document.getElementById(id+"-view").hidden=id!==b.dataset.view;for(const x of document.querySelectorAll("[data-view]"))x.setAttribute("aria-pressed",String(x===b));document.querySelector(".actor").textContent="Acting as "+(b.dataset.view==="customer"?"Cara Okafor":"Noah Brandt");}
 if(b.hasAttribute("data-download")){const payload=DATA.recorded?DATA.record:{source:"synthetic_run",contract:c,owner:"Noah Brandt",generation:4,keys:0,termsDigest:"fixture:9a04-f783",closeTransaction:"fixture:close-04",codeHash:"fixture:wasm-04",unitsAtClose:80,unitsAfterNextUse:79};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=DATA.recorded?"testnet-evidence-excerpt.json":"synthetic-handoff-receipt.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),500);}
});
document.addEventListener("input",e=>{if(e.target.id==="assumption"){const v=e.target.valueAsNumber;document.querySelector("#projection").value=Number.isInteger(v)&&v>=0&&v<=1000000?(v*3.1).toFixed(2)+" TUSD":"Unknown";}});
if(location.hash.includes("books")) document.querySelector('[data-view="books"]')?.click();
</script></body></html>
