[package]
name = "business-v2"
description = "One business on NEAR, v2: takes payments in one accepted token, holds customer money until earned, refunds by its published rules, keeps monthly books, and sells with token-funded holds"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
cargo-near-build = "=0.11.5"
near-api = "=0.8.6"
near-sandbox = { version = "=0.3.16", features = ["generate"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
