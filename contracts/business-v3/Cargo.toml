[package]
name = "business-v3"
description = "One business on NEAR, v3 core (undeployed): prepaid unit entitlements with customer-signed holds and uses, refunds and claims through bounded payout slots, fixed-size storage"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
hex = "0.4"
# Only to decode use-keys exactly as the host verifier does and refuse weak (small-order) keys
# (003e1). Same version as near-vm-runner 0.37.4's verifier; already in Cargo.lock.
ed25519-dalek = { version = "=2.2.0", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
# Synthetic test signatures only (fixed seeds); already in Cargo.lock.
ed25519-dalek = "=2.2.0"
# Test inputs only: the curve's eight small-order (torsion) points; already in Cargo.lock.
curve25519-dalek = "=4.1.3"
# tests/sandbox.rs: the contract on a real local node (same versions as business-v2's).
cargo-near-build = "=0.11.5"
near-api = "=0.8.6"
near-sandbox = { version = "=0.3.16", features = ["generate"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
