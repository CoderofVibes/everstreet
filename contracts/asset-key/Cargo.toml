[package]
name = "asset-key"
description = "Companion to one business contract: signs two typed actions on one external registry through NEAR Chain Signatures, only for the business's current owner, with the generation in the signing path"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/CoderofVibes/everstreet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
# tests/sandbox.rs: real contract bytes on a local node (same versions as business-v3's).
cargo-near-build = "=0.11.5"
near-api = "=0.8.6"
near-sandbox = { version = "=0.3.16", features = ["generate"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"

[package.metadata.near.reproducible_build]
# NEAR's pinned build image (the one github.com/near/intents uses); the build is checkable by
# anyone with the repository: `cargo near build reproducible-wasm` from this crate.
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
